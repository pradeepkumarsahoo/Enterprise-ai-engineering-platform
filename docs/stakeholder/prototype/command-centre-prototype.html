<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Engineering Command Centre Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: fixed ink sidebar + scrolling work area; every view is a panel grid with evidence-first detail. */
:root {
  --bg: #F3F4F0; --surface: #FCFCFA; --surface-2: #ECEFEA; --ink: #0F1B2D; --muted: #56637A; --line: #DCE0E3;
  --side: #0F1B2D; --side-ink: #C9D3E0; --side-muted: #7F8DA3; --side-active: #1C2C45;
  --accent: #B4481A; --on-accent: #FFF8F3; --accent-soft: #F8E3D6; --blue: #2A5DB0; --blue-soft: #E1E9F7;
  --ok: #2E7D4F; --ok-soft: #DDF0E4; --warn: #9A6200; --warn-soft: #F6EAD0; --crit: #B42318; --crit-soft: #F8DEDA;
  --grid: #E5E8EA; --shadow: 0 1px 2px rgba(15,27,45,.06), 0 4px 16px rgba(15,27,45,.05);
  --f-display: 'Space Grotesk', 'Segoe UI', Arial, sans-serif; --f-body: 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif; --f-mono: 'JetBrains Mono', Consolas, 'Courier New', monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B1422; --surface: #111C2D; --surface-2: #172438; --ink: #E8ECF1; --muted: #98A6BA; --line: #24344C;
  --side: #070E18; --side-ink: #C9D3E0; --side-muted: #7F8DA3; --side-active: #16243A;
  --accent: #F08A4B; --on-accent: #1A0E06; --accent-soft: #3A2416; --blue: #7AA5F2; --blue-soft: #1B2B47;
  --ok: #5BC48A; --ok-soft: #14301F; --warn: #E3AA45; --warn-soft: #33270F; --crit: #F27D73; --crit-soft: #3A1714;
  --grid: #1E2D42; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0B1422; --surface: #111C2D; --surface-2: #172438; --ink: #E8ECF1; --muted: #98A6BA; --line: #24344C;
  --side: #070E18; --side-ink: #C9D3E0; --side-muted: #7F8DA3; --side-active: #16243A;
  --accent: #F08A4B; --on-accent: #1A0E06; --accent-soft: #3A2416; --blue: #7AA5F2; --blue-soft: #1B2B47;
  --ok: #5BC48A; --ok-soft: #14301F; --warn: #E3AA45; --warn-soft: #33270F; --crit: #F27D73; --crit-soft: #3A1714;
  --grid: #1E2D42; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--side); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
.mono { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side); color: var(--side-ink); padding: 20px 12px 24px max(12px, env(safe-area-inset-left, 0px)); position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; gap: 10px; align-items: center; padding: 4px 8px 8px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: #F08A4B; display: grid; place-items: center; flex: none; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 15px; color: #F5F6F2; line-height: 1.2; }
.brand-sub { font-size: 11px; color: var(--side-muted); }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--side-muted); padding: 6px 10px; }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 7px; color: var(--side-ink); text-decoration: none; font-size: 13.5px; }
.nav a:hover { background: var(--side-active); color: #FFFFFF; }
.nav a[aria-current="page"] { background: var(--side-active); color: #FFFFFF; box-shadow: inset 3px 0 0 #F08A4B; }
.nav .count { font-family: var(--f-mono); font-size: 11px; background: #F08A4B; color: #1A0E06; border-radius: 10px; padding: 0 7px; }
.side-foot { margin-top: auto; font-size: 11.5px; color: var(--side-muted); padding: 10px; border-top: 1px solid #1E2D44; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 12px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.crumb { font-size: 13px; color: var(--muted); }
.crumb b { color: var(--ink); font-weight: 600; }
.spacer { flex: 1; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.b-syn { background: var(--warn-soft); color: var(--warn); }
.b-mock { background: var(--blue-soft); color: var(--blue); }
.b-ok { background: var(--ok-soft); color: var(--ok); }
.b-crit { background: var(--crit-soft); color: var(--crit); }
.b-warn { background: var(--warn-soft); color: var(--warn); }
.b-neutral { background: var(--surface-2); color: var(--muted); }
.b-accent { background: var(--accent-soft); color: var(--accent); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.role { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.role select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.icon-btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12.5px; }

.content { padding-block: 24px 48px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; max-width: 1440px; width: 100%; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.page-head h1 { font-size: 28px; line-height: 1.15; margin-top: 4px; }
.page-head .lede { color: var(--muted); max-width: 70ch; margin-top: 6px; }

.grid { display: grid; gap: 16px; }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.panel-h h2 { font-size: 16px; }
.panel-h .sub { font-size: 12px; color: var(--muted); }
.src { font-size: 11.5px; color: var(--muted); font-family: var(--f-mono); }

.kpi { display: flex; flex-direction: column; gap: 6px; }
.kpi .label { font-size: 12.5px; color: var(--muted); }
.kpi .value { font-family: var(--f-display); font-size: 30px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .delta { font-size: 12.5px; }
.up-bad { color: var(--crit); } .up-good { color: var(--ok); }

table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
.t th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.t td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.t tr:last-child td { border-bottom: none; }
.t tr.click { cursor: pointer; }
.t tr.click:hover td { background: var(--surface-2); }
.scroll-x { overflow-x: auto; }
.sev { display: inline-block; font-family: var(--f-mono); font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 5px; }
.sev-1, .sev-2 { background: var(--crit-soft); color: var(--crit); }
.sev-3 { background: var(--warn-soft); color: var(--warn); }
.sev-4 { background: var(--surface-2); color: var(--muted); }

.btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }

.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--f-mono); font-size: 10px; fill: var(--muted); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

.timeline { display: flex; flex-direction: column; }
.tl-item { display: grid; grid-template-columns: 54px 14px minmax(0, 1fr); gap: 10px; padding-bottom: 14px; position: relative; }
.tl-time { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding-top: 1px; }
.tl-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); margin-top: 5px; position: relative; }
.tl-item:not(:last-child) .tl-dot::after { content: ""; position: absolute; left: 4px; top: 12px; width: 2px; height: calc(100% + 26px); background: var(--line); }
.tl-item.hot .tl-dot { background: var(--accent); }
.tl-body b { font-weight: 600; }
.tl-body p { color: var(--muted); font-size: 12.5px; }

.ev { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
.ev-id { font-family: var(--f-mono); font-size: 11.5px; font-weight: 600; background: var(--blue-soft); color: var(--blue); border-radius: 6px; display: grid; place-items: center; height: 26px; }
.ev-k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.ev code { font-family: var(--f-mono); font-size: 12px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; word-break: break-word; }
.ev.hl { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue-soft); }
.flag { margin-top: 8px; font-size: 12px; background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 6px 8px; }

.hyp { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.hyp.lead { border-color: var(--accent); background: linear-gradient(0deg, var(--surface), var(--surface)) padding-box; box-shadow: inset 4px 0 0 var(--accent); }
.conf { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.conf > span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-family: var(--f-mono); font-size: 11.5px; padding: 2px 7px; border-radius: 5px; background: var(--blue-soft); color: var(--blue); border: none; cursor: pointer; }
.chip.neg { background: var(--surface-2); color: var(--muted); }
.unknown li { color: var(--muted); }
ul.clean { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }

.action { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 12px; border: 1px solid var(--line); border-radius: 10px; flex-wrap: wrap; }
.action .what { min-width: 0; flex: 1 1 260px; }
.action .what p { color: var(--muted); font-size: 12.5px; }

.meta-row { display: flex; gap: 8px 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.meta-row b { color: var(--ink); font-weight: 600; }

.approval { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.approval textarea { width: 100%; min-height: 64px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); resize: vertical; }
.approval .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hint { font-size: 12px; color: var(--muted); }
.hint.err { color: var(--crit); }

.bar-row { display: grid; grid-template-columns: 130px minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-size: 12.5px; }
.bar { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 5px; }

.formula { font-family: var(--f-mono); font-size: 12.5px; background: var(--surface-2); border-radius: 8px; padding: 12px; overflow-x: auto; white-space: pre; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12.5px; color: var(--muted); }
.field input[type=range] { width: 100%; accent-color: var(--accent); }
.field select, .field input[type=number] { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }

.diff { font-family: var(--f-mono); font-size: 12px; border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
.diff div { padding: 1px 10px; white-space: pre; }
.diff .add { background: var(--ok-soft); color: var(--ok); }
.diff .del { background: var(--crit-soft); color: var(--crit); }
.diff .ctx { color: var(--muted); }
.comment { border-left: 3px solid var(--blue); background: var(--blue-soft); padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: 12.5px; }

.arch { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: stretch; }
.arch .box { border: 1px solid var(--line); border-radius: 9px; padding: 10px; font-size: 12.5px; background: var(--surface-2); }
.arch .box b { display: block; font-family: var(--f-display); font-size: 13.5px; }

.toast { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow); z-index: 20; max-width: min(420px, calc(100vw - 40px)); }
.empty { color: var(--muted); font-size: 13px; padding: 16px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
.note { font-size: 12.5px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; }

@media (max-width: 1100px) { .g-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g-main { grid-template-columns: minmax(0, 1fr); } .g-3 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); gap: 10px; }
  .nav { flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .nav-groups { display: flex; gap: 4px; overflow-x: auto; }
  .nav-group { flex-direction: row; }
  .nav-label, .side-foot { display: none; }
  .nav a { white-space: nowrap; }
  .topbar { position: static; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .content { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .g-2, .g-4 { grid-template-columns: minmax(0, 1fr); }
  .arch { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: no-preference) { .view-enter { animation: rise .22s ease-out; } @keyframes rise { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } } }
</style>

<div class="app">
  <aside class="side" aria-label="Primary">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 18 18"><polyline points="1,13 6,12 9,13 11,7 13,4 17,3" fill="none" stroke="#1A0E06" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div><div class="brand-name">Command Centre</div><div class="brand-sub">Engineering AI platform · prototype</div></div>
    </div>
    <nav class="nav nav-groups" id="nav"></nav>
    <div class="side-foot">Independently built reference prototype. All data shown is synthetic. AI output comes from a deterministic mock provider.</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="spacer"></div>
      <span class="badge b-syn"><span class="dot"></span>Synthetic demo data</span>
      <span class="badge b-mock"><span class="dot"></span>Mock AI provider</span>
      <div class="role"><label for="role">Viewing as</label><select id="role"></select></div>
      <button class="icon-btn" id="theme" type="button" aria-label="Toggle colour theme">Theme</button>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } } };

  /* ---------- Roles (demo identities; permissions enforced in this prototype's logic) ---------- */
  const ROLES = {
    sre: { label: 'Sam · SRE', user: 'sam.sre@demo', perms: ['incident:investigate', 'incident:write', 'approval:request', 'approval:decide', 'chaos:run'] },
    admin: { label: 'Adrian · Platform admin', user: 'adrian.admin@demo', perms: ['*'] },
    security: { label: 'Sasha · Security engineer', user: 'sasha.sec@demo', perms: ['approval:request', 'approval:decide', 'security:exception'] },
    exec: { label: 'Avery · Engineering executive', user: 'avery.exec@demo', perms: ['approval:decide', 'licensing:approve'] },
    developer: { label: 'Devon · Developer', user: 'devon.dev@demo', perms: ['approval:request'] },
    auditor: { label: 'Aud · Read-only auditor', user: 'aud.auditor@demo', perms: [] },
  };
  const can = (p) => { const r = ROLES[state.role]; return r.perms.includes('*') || r.perms.includes(p); };

  /* ---------- State ---------- */
  const now = () => { const d = new Date(); return d.toISOString().slice(11, 19); };
  const cid = () => Math.random().toString(16).slice(2, 10);
  const state = {
    role: store.get('cc.role', 'sre'),
    approvals: [
      { id: 'APR-2041', action: 'chaos.experiment.run', title: 'Latency injection on promotion-engine (sandbox)', risk: 'high', env: 'sandbox', by: 'sam.sre@demo', decide: 'chaos:run', reason: 'Quarterly resilience test of the promotion dependency path.', status: 'pending', created: '09:14', detail: '300 ms added latency · 5 min · 10% blast radius · abort if loyalty-ledger error rate > 2%' },
      { id: 'APR-2039', action: 'security.exception.request', title: 'Exception for transitive dependency finding in notification-worker', risk: 'high', env: '—', by: 'devon.dev@demo', decide: 'security:exception', reason: 'Vulnerable function is not reachable from service code; upgrade planned next sprint.', status: 'pending', created: '08:52', detail: 'Finding SYN-0001 · 14-day exception · compensating control: egress allow-list' },
      { id: 'APR-2036', action: 'license.purchase.request', title: 'Expand fictional ObservaCorp APM seats from 40 to 60', risk: 'high', env: '—', by: 'finley.finops@demo', decide: 'licensing:approve', reason: 'Two teams join the on-call rotation next quarter.', status: 'pending', created: 'Yesterday', detail: 'Planning estimate only; price from fictional sample catalogue' },
    ],
    audit: [
      { t: '14:12:41', actor: 'agent:incident-investigator', action: 'agent.run.completed', target: 'INC-1042', outcome: 'success', cid: '7f3a91c2' },
      { t: '14:12:37', actor: 'agent:incident-investigator', action: 'tool.call', target: 'metrics.query (read-only)', outcome: 'success', cid: '7f3a91c2' },

    let total = 0, rows = '', users = state.tco.users;
    for (let y = 1; y <= state.tco.years; y++) { const cost = users * price; total += cost; rows += `<tr><td>Year ${y}</td><td class="num">${Math.round(users)}</td><td class="num">$${price}</td><td class="num">$${Math.round(cost).toLocaleString()}</td></tr>`; users = users * (1 + state.tco.growth / 100); }
    return { price, total, rows };
  }

      <div class="scroll-x"><table class="t"><tr><th>Principal</th><th>Situation</th><th>Access</th><th>Last used</th><th>Recommendation</th><th>Risk</th></tr>

  /* ---------- Router ---------- */
  function route() {
    let k = (location.hash || '#overview').slice(1);
    if (!V[k]) k = 'overview';
    renderNav(k);
    $('#crumb').innerHTML = `Command Centre / <b>${TITLES[k]}</b>`;
    const view = $('#view');
    view.innerHTML = V[k]();
    view.classList.remove('view-enter'); void view.offsetWidth; view.classList.add('view-enter');
    if (state.hl) { const el = $('#ev-' + state.hl); if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  }
  window.addEventListener('hashchange', () => { state.hl = null; route(); window.scrollTo(0, 0); });

  let toastTimer;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3200); }

  /* ---------- Interactions ---------- */
  document.addEventListener('click', (e) => {
    const go = e.target.closest('[data-go]'); if (go) { location.hash = go.dataset.go; return; }
    const chip = e.target.closest('[data-ev]'); if (chip) { state.hl = chip.dataset.ev; route(); return; }
    const tst = e.target.closest('[data-toast]'); if (tst) { toast(tst.dataset.toast); return; }
    const rq = e.target.closest('[data-req]');
    if (rq && !rq.disabled) {
      const k = rq.dataset.req, id = 'APR-' + (2042 + Object.keys(state.requested).length);
      const map = { pool: ['Restore maximum-pool-size to 50 on membership-api (simulated)', 'medium', 'Config diff E5 shows the limit was cut; RB-017 step 3.'], rollback: ['Roll back membership-api to v2.13 (simulated)', 'high', 'H1 at 0.72 confidence; latency 10× above SLO.'] };
      state.approvals.unshift({ id, action: 'incident.remediation.simulate', title: map[k][0], risk: map[k][1], env: 'sandbox', by: ROLES[state.role].user, decide: 'incident:write', reason: map[k][2], status: 'pending', created: now().slice(0, 5), detail: 'Linked to INC-1042 · evidence E1, E3, E5' });
      state.requested[k] = id; audit('approval.request', id); route(); toast(`${id} sent for approval. Someone other than you must decide it.`); return;
    }
    const dc = e.target.closest('[data-decide]');
    if (dc && !dc.disabled) {
      const a = state.approvals.find((x) => x.id === dc.dataset.id); const ta = $('#rs-' + a.id); const reason = (ta.value || '').trim();
      if (reason.length < 10) { const m = $('#msg-' + a.id); m.textContent = 'Add a reason of at least 10 characters.'; m.classList.add('err'); ta.focus(); return; }
      a.status = dc.dataset.decide === 'approve' ? 'approved' : 'rejected'; a.decidedBy = ROLES[state.role].user; a.decisionReason = reason;
      audit('approval.' + dc.dataset.decide, a.id); route(); toast(`${a.id} ${a.status}. Recorded in the audit log.`);
    }
  });
  document.addEventListener('input', (e) => {
    const id = e.target.id;
    if (id === 'tco-users') $('#o-users').textContent = e.target.value;
    if (id === 'tco-growth') $('#o-growth').textContent = e.target.value + '%';
  });
  document.addEventListener('change', (e) => {
    const id = e.target.id;
    if (id === 'tco-tier') state.tco.tier = e.target.value;
    else if (id === 'tco-users') state.tco.users = +e.target.value;
    else if (id === 'tco-growth') state.tco.growth = +e.target.value;
    else return;
    route(); const el = $('#' + id); if (el) el.focus();
  });

  const sel = $('#role');
  sel.innerHTML = Object.entries(ROLES).map(([k, r]) => `<option value="${k}">${r.label}</option>`).join('');
  if (!ROLES[state.role]) state.role = 'sre';
  sel.value = state.role;
  sel.addEventListener('change', () => { state.role = sel.value; store.set('cc.role', state.role); route(); toast(`Now viewing as ${ROLES[state.role].label}. Permissions changed.`); });

  $('#theme').addEventListener('click', () => {
    const root = document.documentElement; const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
  });

  route();
})();
</script>

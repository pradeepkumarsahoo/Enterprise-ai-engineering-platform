# Author: Pradeep Sahoo
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-investigator"
version = "0.1.0"
description = "Engineering Command Centre pilot: incident investigation (replay + shadow) and knowledge & runbooks"
requires-python = ">=3.10"
authors = [{ name = "Pradeep Sahoo" }]
readme = "README.md"
dependencies = []              # the core runs on the standard library only

[project.optional-dependencies]
claude = ["anthropic>=2.0"]    # only needed for --provider claude
dev = ["pytest>=8"]

[project.scripts]
investigator = "investigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Engineering Command Centre · product configuration
# Author: Pradeep Sahoo
#
# One file configures the whole product: which use cases are switched on, the model,
# shared sources, and each use case's data, thresholds and pilot gates.
#
# Check it with:   python ecc.py config validate
# See the result:  python ecc.py config show
#
# Precedence: command-line flag > environment variable > this file > default in code.
# Environment overrides: ECC_CONFIG (this file's location), ECC_PROVIDER, ECC_MODEL.
# Relative paths are resolved against [product].root, which is relative to this file.
# Unknown keys and wrong types are errors, so a typo cannot silently fall back to a default.

[product]
name = "Engineering Command Centre"
environment = "pilot"          # pilot | production (informational)
root = ".."                    # the repository root
runs_dir = "runs"              # outputs: runs/<use case>/... (git-ignored)

[model]
provider = "mock"              # mock (free, deterministic) | claude (costs money; needs ANTHROPIC_API_KEY)
claude_model = "claude-opus-5-5"
effort = "high"                # low | medium | high | xhigh | max
max_tokens = 16000
fallbacks = "default"          # server-side refusal fallback; "" turns it off

# Read-only sources shared by more than one use case.
[sources]
runbooks = "shared-data/synthetic/runbooks.json"
catalogue = "shared-data/synthetic/catalogue.json"      # service catalogue: owners, SLOs, contract consumers

# Read-only connectors to systems of record.
# ServiceNow: the URL below is a DUMMY instance. With transport = "fixture" the connector reads
# shared-data/synthetic/servicenow/ (Table API-shaped JSON) instead of calling the network.
# For a real instance: set url, transport = "http", and export either ECC_SERVICENOW_TOKEN or
# ECC_SERVICENOW_USER + ECC_SERVICENOW_PASSWORD for a read-only integration user (time zone UTC).
[connectors.servicenow]
url = "https://dev00000.service-now.com"
transport = "fixture"          # fixture | http
fixture_dir = "shared-data/synthetic/servicenow"
user_env = "ECC_SERVICENOW_USER"
password_env = "ECC_SERVICENOW_PASSWORD"
token_env = "ECC_SERVICENOW_TOKEN"
timeout_s = 30
page_size = 100
max_records = 500              # hard cap per table read

# ------------------------------------------------------------------ use case 1
[use_cases.incident]
enabled = true
module = "ecc_incident"

[use_cases.incident.paths]
incidents = "use-cases/incident-investigation/data/synthetic/incidents"
labels = "use-cases/incident-investigation/data/synthetic/labels.json"      # scoring only; never read by the investigator
live = "use-cases/incident-investigation/data/synthetic/live"               # shadow-mode inbox

[use_cases.incident.settings]
lead_confidence_min = 0.5      # below this, the answer is "cause not established"
max_confidence = 0.95          # no hypothesis is ever shown as certain
servicenow_query = "active=false^priorityIN1,2"   # which closed incidents `ecc incident servicenow` replays

[use_cases.incident.gates]
lead_accuracy_min = 0.75
false_confident_leads_max = 0
unsupported_claims_max = 0
actions_executed_max = 0
note = "Use case 1. Placeholder thresholds; replace with targets agreed after the baseline."

# ------------------------------------------------------------------ use case 2
[use_cases.knowledge]
enabled = true
module = "ecc_knowledge"

[use_cases.knowledge.paths]
knowledge_dir = "use-cases/knowledge-runbooks/data/synthetic"

[use_cases.knowledge.settings]
stale_days = 180               # a runbook not validated for this long is stale
drift_lookback_days = 180      # incidents considered for practice drift and coverage gaps
repeat_gap_days = 90           # the same cause again within this many days is a repeat
repeat_lookback_days = 180     # the latest incident of a repeat cluster must be this recent

[use_cases.knowledge.gates]
findings_recall_min = 0.8
findings_precision_min = 0.8
repeat_clusters_exact = true
rejected_edits_max = 0
edits_published_without_approval_max = 0
note = "Use case 2. Placeholder thresholds; replace with targets agreed with runbook owners."

# ------------------------------------------------------------------ use case 3
[use_cases.architecture]
enabled = true
module = "ecc_architecture"

[use_cases.architecture.paths]
arch_dir = "use-cases/architecture-adlc/data/synthetic"

[use_cases.architecture.settings]
availability_margin = 0.05     # within this many points below target = at risk
latency_margin = 1.2           # up to 20% over the latency target = at risk
throughput_margin = 0.8        # at least 80% of the throughput target = at risk
mermaid_url = "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs"

[use_cases.architecture.gates]
assessment_accuracy_min = 0.95
preferred_option_match = true
nfr_trace_recall_min = 0.9
rejected_drafts_max = 0
invented_figures_max = 0
decisions_made_without_approval_max = 0
diagram_issues_max = 0
note = "Use case 3. Placeholder thresholds; replace with targets agreed with the architecture review board."

# ------------------------------------------------------------------ use case 4
[use_cases.change]
enabled = true
module = "ecc_change"

[use_cases.change.paths]
changesets_dir = "use-cases/change-risk/data/synthetic/changesets"   # PR diffs, migrations, contracts, coverage
calendar = "use-cases/change-risk/data/synthetic/release_calendar.json"

# Risk = sum of the weights of the factors that fire, capped at 10. Who must approve (two people
# for a high score, never the requester or an agent) is governance and lives in code.
[use_cases.change.settings]
weight_sensitive_config = 2.5      # capacity or timeout setting changed
weight_capacity_cut = 1.0          # ... and cut by at least capacity_cut_ratio
weight_repeat_pattern = 1.5        # same setting, table or contract as a change followed by an incident
weight_migration_blocking = 1.8    # migration that can lock a large table
weight_migration_online = 0.6
weight_unindexed_query = 1.8       # new query on a large table without an index
weight_contract_base = 0.5         # contract change: base + per consumer, up to max
weight_contract_per_consumer = 0.25
weight_contract_max = 1.5
weight_coverage_gap = 0.8
weight_deploy_window = 0.5         # outside the low-traffic window
weight_freeze = 2.0                # inside a change freeze
weight_recent_instability = 0.4    # incidents on the service in the last instability_days
weight_no_rollback = 0.5           # no runbook, or a stale one
weight_change_size = 0.3
medium_min = 3.0
high_min = 7.0                     # a high score needs a second approver
capacity_cut_ratio = 0.5
large_table_rows = 1000000
coverage_gate_pct = 80
instability_days = 30
runbook_stale_days = 180
change_size_files = 20
outcome_window_hours = 48          # an incident this soon after a change is linked to it
as_of = "2026-11-17"               # "now" for the synthetic data; in production, today's date

[use_cases.change.gates]
recall_min = 0.8                   # backtest: incident-causing changes scored medium or high
false_alarm_max = 0.3              # backtest: medium or high scores with nothing after them
rejected_conditions_max = 0
invented_figures_max = 0
note = "Use case 4. Placeholder thresholds; replace with targets agreed with release management after a backtest on real history."


# ------------------------------------------------------------------ use case 5
[use_cases.finops]
enabled = true
module = "ecc_finops"

[use_cases.finops.paths]
finops_dir = "use-cases/finops/data/synthetic"   # cost export, utilisation, config change log, savings register

# Anomaly: z >= z_threshold against the trailing baseline AND increase >= min_increase_usd AND
# >= min_increase_ratio. Who may approve a recommendation (the owning team, never an agent or
# FinOps alone) is governance and lives in code.
[use_cases.finops.settings]
baseline_months = 6
min_baseline_months = 4
z_threshold = 3.0
stdev_floor_ratio = 0.02           # deviation is at least 2% of the mean, so flat series are not over-sensitive
min_increase_usd = 1000.0
min_increase_ratio = 0.10          # steady growth below 10% a month is growth, not an anomaly
cause_lookback_days = 14
rightsize_cpu_p95_max = 25.0
rightsize_mem_p95_max = 40.0
rightsize_saving_ratio = 0.5
office_hours_per_week = 65         # 07:00-20:00, Monday to Friday
always_on_hours_min = 160
non_prod_envs = "sandbox,staging,dev"
idle_days = 30
realised_baseline_months = 3
rejected_cooldown_days = 180
as_of = "2026-11-17"               # "now" for the synthetic data; in production, today's date

[use_cases.finops.gates]
anomaly_precision_min = 0.8
anomaly_recall_min = 0.8
cause_accuracy_min = 0.8
realised_error_max = 0.1           # realised saving within 10% of the labelled value
rejected_drafts_max = 0
invented_figures_max = 0
cloud_changes_max = 0
note = "Use case 5. Placeholder thresholds; replace with targets agreed with finance and the FinOps lead after a run on a real cost export."

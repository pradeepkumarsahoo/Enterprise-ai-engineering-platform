# Author: Pradeep Sahoo
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ecc-core"
version = "0.2.0"
description = "Engineering Command Centre platform core: configuration, plugin contract, ecc CLI, model client, evidence, safety, audit"
requires-python = ">=3.11"     # tomllib for the product configuration
authors = [{ name = "Pradeep Sahoo" }]
readme = "README.md"
dependencies = []              # standard library only

[project.optional-dependencies]
claude = ["anthropic>=2.0"]    # only needed for provider = "claude"
dev = ["pytest>=8"]

[project.scripts]
ecc = "ecc_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
